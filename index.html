<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Técnico - Electricidad & Split</title>
    
    <!-- PROGRAMACIÓN (JAVASCRIPT) - PUESTA ARRIBA PARA QUE SÍ O SÍ EXISTA -->
    <script>
        // Datos en LocalStorage
        let trabajos = JSON.parse(localStorage.getItem('tech_trabajos')) || [];
        let visitas = JSON.parse(localStorage.getItem('tech_visitas')) || [];

        // Cambiar entre pantallas de forma directa
        window.switchTab = function(tabName, event) {
            try {
                // Ocultar todas las pestañas
                document.getElementById('tab-trabajos').style.display = 'none';
                document.getElementById('tab-agenda').style.display = 'none';
                document.getElementById('tab-balance').style.display = 'none';

                // Quitar el color activo de todos los botones
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

                // Mostrar la pestaña correcta
                const targetTab = document.getElementById('tab-' + tabName);
                if (targetTab) targetTab.style.display = 'block';
                
                // Activar visualmente el botón
                if (event && event.currentTarget) {
                    event.currentTarget.classList.add('active');
                } else {
                    document.querySelectorAll('.tab-btn').forEach(btn => {
                        if (btn.innerText.toLowerCase().includes(tabName)) btn.classList.add('active');
                    });
                }
                
                // Cargar datos en las pantallas correspondientes
                if (tabName === 'balance') renderBalance();
                if (tabName === 'agenda') renderVisitas();
            } catch (error) {
                console.error("Error al cambiar pestaña: " + error.message);
            }
        }

        function resetearFormulario() {
            document.getElementById('finanzas-form').reset();
            document.getElementById('trabajo-id').value = '';
            document.getElementById('contenedor-monto-seña').style.display = 'none';
            document.getElementById('form-titulo').innerText = "Registrar Trabajo Realizado";
            document.getElementById('btn-submit').innerText = "Guardar Registro";
            document.getElementById('btn-cancelar').style.display = 'none';
        }

        function renderVisitas() {
            const contenedor = document.getElementById('lista-visitas');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            if (visitas.length === 0) {
                contenedor.innerHTML = `<p style="color:#7f8c8d; text-align:center; padding: 10px;">No tenés visitas pendientes.</p>`;
                return;
            }

            visitas.forEach(v => {
                const div = document.createElement('div');
                div.className = 'visita-item';
                div.innerHTML = `
                    <div class="visita-info">
                        <h4>👤 ${v.cliente}</h4>
                        <p>📍 ${v.direccion}</p>
                        <p>🔧 Falla: ${v.falla}</p>
                        <p>📅 Fecha: ${v.fecha.split('-').reverse().join('/')}</p>
                    </div>
                    <div>
                        <button class="btn-tabla-accion btn-check" onclick="completarVisita(${v.id})">✅</button>
                        <button class="btn-tabla-accion btn-trash" onclick="eliminarVisita(${v.id})">🗑️</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        window.completarVisita = function(id) {
            const v = visitas.find(vis => vis.id === id);
            if (!v) return;
            document.getElementById('trabajo-cliente').value = v.cliente;
            document.getElementById('trabajo-descripcion').value = `Visita por: ${v.falla}`;
            visitas = visitas.filter(vis => vis.id !== id);
            localStorage.setItem('tech_visitas', JSON.stringify(visitas));
            window.switchTab('trabajos');
        }

        window.eliminarVisita = function(id) {
            if (confirm("¿Borrar visita?")) {
                visitas = visitas.filter(v => v.id !== id);
                localStorage.setItem('tech_visitas', JSON.stringify(visitas));
                renderVisitas();
            }
        }

        function renderBalance() {
            const lista = document.getElementById('lista-trabajos');
            if (!lista) return;
            lista.innerHTML = '';

            let ingresos = 0; let gastos = 0; let cobrar = 0;

            if (trabajos.length === 0) {
                lista.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:15px; color:#7f8c8d;">No hay registros.</td></tr>`;
            } else {
                [...trabajos].reverse().forEach(t => {
                    let monto = parseFloat(t.montoTotal) || 0;
                    let claseEstado = (t.estado || '').toLowerCase();
                    let textoEstado = t.estado;

                    if (t.estado === 'Gasto') { gastos += monto; }
                    else if (t.estado === 'Cobrado') { ingresos += monto; textoEstado = '✓ Cobrado'; }
                    else if (t.estado === 'Pendiente') { cobrar += monto; textoEstado = '⏳ Pendiente'; }
                    else if (t.estado === 'Seña') {
                        let seña = parseFloat(t.señaAbonada) || 0;
                        ingresos += seña; cobrar += (monto - seña);
                        textoEstado = '⏳ Señado';
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${t.cliente}</strong><br><small style="color:#7f8c8d">${t.rubro}</small></td>
                        <td><strong>$${monto.toFixed(2)}</strong></td>
                        <td><span class="status-badge ${claseEstado}">${textoEstado}</span></td>
                        <td>
                            <button class="btn-tabla-accion btn-edit" onclick="editarTrabajo(${t.id})">✏️</button>
                            <button class="btn-tabla-accion btn-trash" onclick="eliminarTrabajo(${t.id})">🗑️</button>
                        </td>
                    `;
                    lista.appendChild(tr);
                });
            }

            document.getElementById('total-ingresos').innerText = `$${ingresos.toFixed(2)}`;
            document.getElementById('total-gastos').innerText = `$${gastos.toFixed(2)}`;
            document.getElementById('total-por-cobrar').innerText = `$${cobrar.toFixed(2)}`;
            document.getElementById('total-neto').innerText = `$${(ingresos - gastos).toFixed(2)}`;
        }

        window.editarTrabajo = function(id) {
            const t = trabajos.find(trab => trab.id === id);
            if (!t) return;
            document.getElementById('trabajo-id').value = t.id;
            document.getElementById('trabajo-cliente').value = t.cliente;
            document.getElementById('trabajo-rubro').value = t.rubro;
            document.getElementById('trabajo-monto').value = t.montoTotal;
            document.getElementById('trabajo-estado').value = t.estado;
            document.getElementById('trabajo-descripcion').value = t.descripcion;
            window.switchTab('trabajos');
        }

        window.eliminarTrabajo = function(id) {
            if (confirm("¿Borrar registro?")) {
                trabajos = trabajos.filter(t => t.id !== id);
                localStorage.setItem('tech_trabajos', JSON.stringify(trabajos));
                renderBalance();
            }
        }

        // Eventos iniciales
        window.onload = function() {
            const finanzasForm = document.getElementById('finanzas-form');
            const agendaForm = document.getElementById('agenda-form');
            const btnCancelar = document.getElementById('btn-cancelar');
            const selectEstado = document.getElementById('trabajo-estado');

            if (selectEstado) {
                selectEstado.addEventListener('change', (e) => {
                    const contenedor = document.getElementById('contenedor-monto-seña');
                    const inputSeña = document.getElementById('trabajo-monto-seña');
                    if (e.target.value === 'Seña') {
                        contenedor.style.display = 'block';
                        inputSeña.setAttribute('required', 'true');
                    } else {
                        contenedor.style.display = 'none';
                        inputSeña.removeAttribute('required');
                        inputSeña.value = '';
                    }
                });
            }

            if (finanzasForm) {
                finanzasForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const id = document.getElementById('trabajo-id').value;
                    const cliente = document.getElementById('trabajo-cliente').value;
                    const rubro = document.getElementById('trabajo-rubro').value;
                    const montoTotal = parseFloat(document.getElementById('trabajo-monto').value) || 0;
                    const estado = document.getElementById('trabajo-estado').value;
                    const descripcion = document.getElementById('trabajo-descripcion').value;
                    
                    let señaAbonada = 0;
                    if (estado === 'Seña') {
                        señaAbonada = parseFloat(document.getElementById('trabajo-monto-seña').value) || 0;
                    }

                    const nuevoTrabajo = {
                        id: id ? parseInt(id) : Date.now(),
